{% extends 'base.html' %}

{% block title %}Page Not Found (404) - Minkart{% endblock %}

{% block content %}
<div class="empty-card-container-lg">
    <div class="error-code-primary">404</div>
    <h1 class="empty-card-title">Page Not Found</h1>
    <p class="empty-card-desc">
        Sorry, the page or product you are looking for does not exist or has been moved.
    </p>
    <a href="{{ url_for('index') }}" class="btn btn-primary">Return to Homepage</a>
</div>
{% endblock %}
