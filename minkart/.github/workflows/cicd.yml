name: Minkart CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # ==========================================
  # STAGE 1 — TEST
  # ==========================================
  test:
    name: Stage 1 - Run Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Automated Pytest
        run: |
          pytest -v

  # ==========================================
  # STAGE 2 & 3 — BUILD AND PUSH
  # ==========================================
  build-and-push:
    name: Stage 2 & 3 - Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/minkart:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/minkart:${{ github.sha }}

  # ==========================================
  # STAGE 4 — MVP SIMULATED DEPLOYMENT
  # ==========================================
  deploy-verification:
    name: Stage 4 - MVP Simulated Deployment Verification
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Pull Docker Image
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/minkart:latest

      - name: Run Test Container
        run: |
          docker run -d --name minkart_test_instance -p 5000:5000 ${{ secrets.DOCKERHUB_USERNAME }}/minkart:latest
          sleep 5

      - name: Verify Application Endpoint
        run: |
          curl -f http://localhost:5000/ || exit 1
          echo "✅ MVP Simulated Deployment Verification Succeeded! Minkart application responds with 200 OK."

      - name: Display Deployment Logs
        if: always()
        run: |
          docker logs minkart_test_instance
          docker stop minkart_test_instance
          docker rm minkart_test_instance
