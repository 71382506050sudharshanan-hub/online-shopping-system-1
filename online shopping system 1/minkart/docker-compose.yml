version: '3.8'

services:
  minkart:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: minkart_web
    ports:
      - "5000:5000"
    volumes:
      - ./database:/app/database
    environment:
      - SECRET_KEY=minkart_production_secret_key_2026
      - PORT=5000
    restart: unless-stopped
