{% extends 'base.html' %}

{% block title %}Server Error (500) - Minkart{% endblock %}

{% block content %}
<div class="empty-card-container-lg">
    <div class="error-code-danger">500</div>
    <h1 class="empty-card-title">Unexpected Server Error</h1>
    <p class="empty-card-desc">
        Something went wrong on our end while processing your request. Please try again in a few moments.
    </p>
    <a href="{{ url_for('index') }}" class="btn btn-primary">Return to Homepage</a>
</div>
{% endblock %}
